name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test ve APK derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Sürüm bilgisi
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: İmzalama anahtarını hazırla (varsa)
        env:
          KEYSTORE_B64: ${{ secrets.LIFEOS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LIFEOS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "Release APK, depo sırrındaki anahtarla imzalanacak."
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::LIFEOS_KEYSTORE_BASE64 sırrı yok; release APK imzasız üretilecek."
          fi

      - name: Birim testleri
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug ve Release APK derle
        env:
          LIFEOS_KEYSTORE_PASSWORD: ${{ secrets.LIFEOS_KEYSTORE_PASSWORD }}
          LIFEOS_KEY_ALIAS: ${{ secrets.LIFEOS_KEY_ALIAS }}
          LIFEOS_KEY_PASSWORD: ${{ secrets.LIFEOS_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease lintDebug --stacktrace

      - name: APK dosyalarını hazırla
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LifeOS-${APP_VERSION}-debug.apk"
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/LifeOS-${APP_VERSION}.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/LifeOS-${APP_VERSION}-release-unsigned.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist && cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-apk
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  instrumented:
    name: Emülatörde açılış testi
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Arayüz testleri (API 30 emülatör)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: androidTest-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, instrumented]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LifeOS-apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
